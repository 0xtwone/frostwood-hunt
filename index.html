<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霜林猎歌</title>
<style>
  html,body{margin:0;height:100%;background:#0b1014;overflow:hidden;font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#e8e2d0;user-select:none}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%,#23323a 0%,#0b1014 70%);z-index:9;text-align:center;padding:24px;box-sizing:border-box}
  #start h1{font-size:clamp(40px,8vw,84px);letter-spacing:.3em;margin:0 0 6px;font-weight:600;color:#e9dcb8;text-shadow:0 0 30px #7fb2c455}
  #start .sub{letter-spacing:.5em;color:#8fa7ae;margin-bottom:28px;font-size:14px}
  #start p{max-width:560px;line-height:1.9;color:#b9c2c0;font-size:15px;margin:0 0 20px}
  #keys{display:grid;grid-template-columns:auto auto;gap:6px 18px;text-align:left;font-size:14px;color:#cfd6d2;margin-bottom:30px}
  #keys b{color:#e9dcb8;font-weight:600;text-align:right}
  #go{font:inherit;font-size:18px;letter-spacing:.4em;padding:14px 44px 14px 52px;background:#1a2a30;color:#e9dcb8;border:1px solid #6d8a8f;cursor:pointer}
  #go:hover:not(:disabled){background:#27414a}#go:disabled{opacity:.5;cursor:wait}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none;text-shadow:0 1px 2px #000}
  .bar{position:absolute;left:20px;width:250px;background:#12181bcc;border:1px solid #0008;box-sizing:border-box}
  .bar i{display:block;height:100%}.bar span{position:absolute;left:8px;top:0;font-size:12px;line-height:inherit}
  #hpb{top:20px;height:18px;line-height:17px}#hpb i{background:#a32a22}
  #xpb{top:44px;height:14px;line-height:13px}#xpb i{background:#3d7fa8}
  #stat{position:absolute;left:20px;top:66px;width:250px;box-sizing:border-box;background:#0a1014aa;padding:5px 10px;font-size:15px;display:flex;justify-content:space-between}
  #stat .g{color:#ffd866}
  #mini{position:absolute;right:20px;top:20px;border:1px solid #6d8a8f88;background:#0a1014aa}
  #prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#0a1014cc;border:1px solid #6d8a8f;padding:7px 20px;font-size:17px;color:#e9dcb8;display:none;white-space:nowrap}
  #dialog{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);width:min(680px,calc(100vw - 40px));box-sizing:border-box;background:#0a1014e0;border:1px solid #6d8a8f;padding:14px 20px;display:none}
  #dialog b{display:block;color:#e9c77a;font-size:15px;margin-bottom:6px}#dialog span{font-size:17px;line-height:1.6}
  #msg{position:absolute;left:50%;top:100px;transform:translateX(-50%);background:#0a1014b0;padding:8px 26px;font-size:19px;opacity:0;transition:opacity .4s;white-space:nowrap}
  #help{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#dce2decc}
  .ft{position:absolute;font-weight:700;font-size:17px;transform:translate(-50%,-50%);white-space:nowrap}
  #red{position:absolute;inset:0;background:#a01414;opacity:0}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="vig"></div><div id="red"></div>
  <div class="bar" id="hpb"><i></i><span></span></div>
  <div class="bar" id="xpb"><i></i><span></span></div>
  <div id="stat"><span id="lv"></span><span class="g" id="gold"></span><span id="kills"></span></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <div id="msg"></div><div id="prompt"></div><div id="dialog"><b></b><span></span></div>
  <div id="help">WASD 移动 · Shift 奔跑 · 鼠标拖动 / ←→ 转视角 · 滚轮缩放 · 空格 攻击 · E 互动 · F 上/下马 · H 口哨 · M 音乐</div>
</div>
<div id="start">
  <h1>霜林猎歌</h1>
  <div class="sub">北 境 · 猎 魔 人 的 一 日</div>
  <p>你是霜誓猎人艾芮娅，带着长柄霜刃与战马「雪雀」来到雪山脚下的灰木村。村外的云杉林里有霜狼出没，湖沼爬出了泥尸，更北的石环中还蛰伏着某种更古老的东西。</p>
  <div id="keys">
    <b>W A S D</b><span>行走（Shift 奔跑）</span>
    <b>鼠标拖动 / ← →</b><span>转动视角（滚轮缩放）</span>
    <b>空格 / J</b><span>挥刃攻击</span>
    <b>E</b><span>交谈 · 进出酒馆 · 喝酒</span>
    <b>F · H</b><span>上马 / 下马 · 吹口哨唤马</span>
    <b>M</b><span>音乐开关</span>
  </div>
  <button id="go" disabled>正在生成北境…</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var T=THREE,$=function(id){return document.getElementById(id);};
if(!T){$('go').textContent='图形库加载失败';return;}
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
var seed=20261112;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function hash(i,j){var n=Math.sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){var i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  var a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
function fbm(x,y,o){var s=0,a=.5,f=1;for(var k=0;k<o;k++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

/* ================= renderer ================= */
var renderer=new T.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
var camera=new T.PerspectiveCamera(55,1,.2,5000);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(typeof post!=='undefined'&&post)post.resize();}
addEventListener('resize',resize);resize();
var FOGC=0xaebcc4;
var world=new T.Scene();world.fog=new T.FogExp2(FOGC,.0021);world.fog.color.convertSRGBToLinear();
var inside=new T.Scene();inside.background=new T.Color(0x070504);
var scene=world,sceneName='world';

/* ================= helpers ================= */
function lin(p){['color','emissive'].forEach(function(k){if(typeof p[k]==='number')p[k]=new T.Color(p[k]).convertSRGBToLinear();});return p;}
function SM(p){return new T.MeshStandardMaterial(lin(p));}
function BM(p){return new T.MeshBasicMaterial(lin(p));}
function M(c,o){var p={color:c,roughness:.86,metalness:0};if(o)for(var k in o)p[k]=o[k];return SM(p);}
function mesh(geo,mat,x,y,z,parent){var m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
function cyl(rt,rb,h,s){return new T.CylinderGeometry(rt,rb,h,s||10);}
function sph(r){return new T.SphereGeometry(r,14,10);}
function box(w,h,d){return new T.BoxGeometry(w,h,d);}
function limb(parent,x,y,z,r,len,mat){var p=new T.Group();p.position.set(x,y,z);parent.add(p);mesh(cyl(r,r*.78,len),mat,0,-len/2,0,p);return p;}
function canvasTex(w,h,fn,rep){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}

/* ================= terrain ================= */
var SIZE=2400,SEG=400,STEP=SIZE/SEG,HALF=SIZE/2,PLAY=470;
var VIL={x:-150,z:60,r:75,h:0},LAKE={x:190,z:180,r:80,h:0},STN={x:250,z:-250},DEN={x:110,z:-130},waterY=0;
function rawH(x,z){return fbm(x*.0045+10,z*.0045+7,5)*46-14+fbm(x*.03,z*.03,3)*2.5;}
VIL.h=rawH(VIL.x,VIL.z);LAKE.h=rawH(LAKE.x,LAKE.z)-2;waterY=LAKE.h-1.7;
function heightAt(x,z){var h=rawH(x,z),d=Math.hypot(x,z),m=sstep(400,950,d);
  if(m>0){var rd=1-Math.abs(fbm(x*.0038+50,z*.0038+50,4)*2-1);h+=m*(50+rd*rd*340)*(.55+.45*m);}
  var dv=Math.hypot(x-VIL.x,z-VIL.z),k=1-sstep(VIL.r*.6,VIL.r*1.7,dv);h+=(VIL.h-h)*k*.93;
  var dl=Math.hypot(x-LAKE.x,z-LAKE.z),kl=1-sstep(LAKE.r*.5,LAKE.r*1.7,dl);h+=(LAKE.h-h)*kl;h-=(1-sstep(0,LAKE.r,dl))*5;
  return h;}
var grid=new Float32Array((SEG+1)*(SEG+1));
function groundY(x,z){var fx=clamp((x+HALF)/STEP,0,SEG-.001),fz=clamp((z+HALF)/STEP,0,SEG-.001),i=Math.floor(fx),j=Math.floor(fz);fx-=i;fz-=j;
  var a=grid[j*(SEG+1)+i],b=grid[j*(SEG+1)+i+1],c=grid[(j+1)*(SEG+1)+i],d=grid[(j+1)*(SEG+1)+i+1];
  return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;}
var PATHS=[[[-420,90],[-250,70],[-150,60],[-60,40],[20,-20],[80,-90],[110,-130]],[[-60,40],[30,100],[110,150],[160,175]],[[110,-130],[180,-190],[250,-250]]];
function nearPath(x,z,d){for(var q=0;q<PATHS.length;q++){var p=PATHS[q];for(var i=0;i<p.length-1;i++){var ax=p[i][0],ay=p[i][1],bx=p[i+1][0],by=p[i+1][1];
  var t=clamp(((x-ax)*(bx-ax)+(z-ay)*(by-ay))/((bx-ax)*(bx-ax)+(by-ay)*(by-ay)),0,1);
  if(Math.hypot(x-ax-t*(bx-ax),z-ay-t*(by-ay))<d)return true;}}return false;}
var treeGrid={},obst=[],houseRects=[],trees=[];
function tkey(x,z){return Math.floor((x+600)/8)+Math.floor((z+600)/8)*200;}
function solid(x,z,r){
  if(x*x+z*z>PLAY*PLAY)return true;var i,j;
  for(i=0;i<houseRects.length;i++){var h=houseRects[i];if(x>h.x0-r&&x<h.x1+r&&z>h.z0-r&&z<h.z1+r)return true;}
  for(i=0;i<obst.length;i++){var o=obst[i];if((o.x-x)*(o.x-x)+(o.z-z)*(o.z-z)<(o.r+r)*(o.r+r))return true;}
  var cx=Math.floor((x+600)/8),cz=Math.floor((z+600)/8);
  for(i=-1;i<=1;i++)for(j=-1;j<=1;j++){var l=treeGrid[(cx+i)+(cz+j)*200];if(!l)continue;
    for(var k=0;k<l.length;k++){var t=l[k],dx=t.x-x,dz=t.z-z;if(dx*dx+dz*dz<(r+.35*t.s)*(r+.35*t.s))return true;}}
  return false;}
function solidIn(x,z,r){if(x<-5.6+r||x>5.6-r||z>4.2-r||z<-1.7)return true;
  var tb=[[-3.4,1.6],[3.4,.8],[3.2,3.1]];for(var i=0;i<3;i++)if(Math.hypot(x-tb[i][0],z-tb[i][1])<1+r)return true;return false;}
function move(e,dx,dz,r){var f=(sceneName==='tavern'&&e===P)?solidIn:solid;if(!f(e.x+dx,e.z,r))e.x+=dx;if(!f(e.x,e.z+dz,r))e.z+=dz;}

var sunDir=new T.Vector3(-.62,.4,.5).normalize(),sun,hemi,skyDome,snow,water;
function buildTerrain(){
  var geo=new T.PlaneGeometry(SIZE,SIZE,SEG,SEG);geo.rotateX(-Math.PI/2);
  var pos=geo.attributes.position,n=pos.count;
  for(var i=0;i<n;i++){var h=heightAt(pos.getX(i),pos.getZ(i));pos.setY(i,h);grid[i]=h;}
  geo.computeVertexNormals();
  // colour map
  var RES=512,small=document.createElement('canvas');small.width=small.height=RES;var sc=small.getContext('2d'),img=sc.createImageData(RES,RES),D=img.data;
  for(var py=0;py<RES;py++)for(var px=0;px<RES;px++){
    var x=(px+.5)/RES*SIZE-HALF,z=(py+.5)/RES*SIZE-HALF,hh=groundY(x,z);
    var sl=Math.hypot(groundY(x+6,z)-groundY(x-6,z),groundY(x,z+6)-groundY(x,z-6))/12;
    var n1=fbm(x*.02,z*.02,3),n2=fbm(x*.07+20,z*.07,2),r=62+n1*44,g=74+n1*40,b=42+n1*22,k;
    if(n2>.5){k=Math.min(1,(n2-.5)*3.2);r+=(122-r)*k;g+=(110-g)*k;b+=(68-b)*k;}
    var td=fbm(x*.012+3,z*.012+9,3);if(td>.45){k=1-Math.min(.38,(td-.45)*2.2);r*=k;g*=k;b*=k;}
    k=sstep(.5,.74,fbm(x*.035+70,z*.035+3,3))*.6+sstep(22,60,hh)*.6;k=Math.min(k,.92);r+=(216-r)*k;g+=(226-g)*k;b+=(232-b)*k;
    var dl=Math.hypot(x-LAKE.x,z-LAKE.z);k=(1-sstep(45,92,dl))*.85;r+=(52-r)*k;g+=(54-g)*k;b+=(42-b)*k;
    k=sstep(.42,.8,sl);var rk=84+n1*46;r+=(rk-r)*k;g+=(rk+3-g)*k;b+=(rk+10-b)*k;
    k=sstep(58,96,hh+n1*34)*(1-sstep(.85,1.5,sl)*.82);r+=(238-r)*k;g+=(243-g)*k;b+=(248-b)*k;
    var o=(py*RES+px)*4;D[o]=r;D[o+1]=g;D[o+2]=b;D[o+3]=255;}
  sc.putImageData(img,0,0);
  var map=canvasTex(2048,2048,function(c,w){c.imageSmoothingQuality='high';c.drawImage(small,0,0,w,w);var S=w/SIZE;
    var gr=c.createRadialGradient((VIL.x+HALF)*S,(VIL.z+HALF)*S,8,(VIL.x+HALF)*S,(VIL.z+HALF)*S,70*S);gr.addColorStop(0,'rgba(108,94,70,.85)');gr.addColorStop(.6,'rgba(104,94,68,.5)');gr.addColorStop(1,'rgba(104,94,68,0)');
    c.fillStyle=gr;c.fillRect(0,0,w,w);c.lineCap=c.lineJoin='round';
    [[9,'rgba(96,84,60,.35)'],[5.5,'rgba(110,94,68,.7)'],[3,'rgba(124,106,78,.8)']].forEach(function(st){c.lineWidth=st[0]*S;c.strokeStyle=st[1];
      PATHS.forEach(function(p){c.beginPath();c.moveTo((p[0][0]+HALF)*S,(p[0][1]+HALF)*S);for(var i=1;i<p.length;i++)c.lineTo((p[i][0]+HALF)*S,(p[i][1]+HALF)*S);c.stroke();});});});
  var detail=noiseTex(256,4,6,function(n,x,y){var v=(.5+(n-.5)*.75)*210+hash(x,y)*40;return [v,v,v];});
  detail.encoding=T.LinearEncoding;detail.wrapS=detail.wrapT=T.RepeatWrapping;
  var mat=SM({map:map,roughness:.95,metalness:0});
  mat.onBeforeCompile=function(sh){sh.uniforms.detailMap={value:detail};
    sh.fragmentShader='uniform sampler2D detailMap;\n'+sh.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\n diffuseColor.rgb*=texture2D(detailMap,vUv*520.).rgb*texture2D(detailMap,vUv*67.3).rgb*3.6;').replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n {vec2 e_=vec2(1./256.,0.);float a0_=texture2D(detailMap,vUv*520.).r;vec2 g1_=vec2(texture2D(detailMap,vUv*520.+e_.xy).r-a0_,texture2D(detailMap,vUv*520.+e_.yx).r-a0_);float b0_=texture2D(detailMap,vUv*67.3).r;vec2 g2_=vec2(texture2D(detailMap,vUv*67.3+e_.xy).r-b0_,texture2D(detailMap,vUv*67.3+e_.yx).r-b0_);vec2 gg_=g1_*2.2+g2_*2.6;normal=normalize(normal-(viewMatrix*vec4(gg_.x,0.,-gg_.y,0.)).xyz);}');};
  var terrain=new T.Mesh(geo,mat);terrain.receiveShadow=true;world.add(terrain);
  // water
  water=new T.Mesh(new T.CircleGeometry(110,48),SM({color:0x6f8894,roughness:.08,metalness:.85,transparent:true,opacity:.88}));
  water.rotation.x=-Math.PI/2;water.position.set(LAKE.x,waterY,LAKE.z);world.add(water);
}
function buildSky(){
  var tex=canvasTex(2048,1024,function(c,w,h){var g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#3d5f85');g.addColorStop(.3,'#6f8fae');g.addColorStop(.46,'#b7c4cc');g.addColorStop(.5,'#aebcc4');g.addColorStop(1,'#aebcc4');c.fillStyle=g;c.fillRect(0,0,w,h);
    var phi=Math.atan2(sunDir.z,-sunDir.x);if(phi<0)phi+=6.2832;var sx=phi/6.2832*w,sy=(Math.PI/2-Math.asin(sunDir.y))/Math.PI*h;
    [-w,0,w].forEach(function(o){var s=c.createRadialGradient(sx+o,sy,0,sx+o,sy,420);s.addColorStop(0,'rgba(255,244,214,1)');s.addColorStop(.05,'rgba(255,232,190,.85)');s.addColorStop(.3,'rgba(255,214,170,.28)');s.addColorStop(1,'rgba(255,210,170,0)');c.fillStyle=s;c.fillRect(0,0,w,h*.52);});
    for(var i=0;i<230;i++){var cx=rnd()*w,cy=150+rnd()*330,rx=60+rnd()*190,a=.03+rnd()*.075;[-w,0,w].forEach(function(o){c.save();c.translate(cx+o,cy);c.scale(1,.28);var q=c.createRadialGradient(0,0,0,0,0,rx);var lit=cy<330?'255,250,244':'226,230,236';q.addColorStop(0,'rgba('+lit+','+a*2+')');q.addColorStop(1,'rgba('+lit+',0)');c.fillStyle=q;c.fillRect(-rx,-rx,rx*2,rx*2);c.restore();});}});
  skyDome=new T.Mesh(new T.SphereGeometry(3500,40,20),BM({map:tex,side:T.BackSide,fog:false,depthWrite:false}));world.add(skyDome);
  try{var env=new T.CanvasTexture(tex.image);env.encoding=T.sRGBEncoding;env.mapping=T.EquirectangularReflectionMapping;water.material.envMap=env;water.material.envMapIntensity=1.1;water.material.needsUpdate=true;}catch(e){}
  try{var pg=new T.PMREMGenerator(renderer);pg.dispose();hemi=new T.HemisphereLight(0xbdd2e8,0x4a4c40,1.0);}catch(e){hemi=new T.HemisphereLight(0xbdd2e8,0x3d4034,.78);}world.add(hemi);
  sunDisk=new T.Mesh(new T.SphereGeometry(55,16,12),new T.MeshBasicMaterial({color:new T.Color(46,38,26),fog:false,depthWrite:false}));world.add(sunDisk);
  sun=new T.DirectionalLight(0xffe0bb,1.75);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  var sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=10;sc.far=420;sun.shadow.bias=-.0006;sun.shadow.normalBias=.06;
  world.add(sun);world.add(sun.target);
  var N=1800,p=new Float32Array(N*3);for(var i=0;i<N*3;i++)p[i]=R(-30,30);
  var sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(p,3));
  snow=new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.11,transparent:true,opacity:.85,depthWrite:false}));snow.frustumCulled=false;world.add(snow);
}
function buildForest(){
  var list=[],x,z;
  for(z=-600;z<600;z+=6.5)for(x=-600;x<600;x+=6.5){var tx=x+rnd()*6.5,tz=z+rnd()*6.5,d=Math.hypot(tx,tz);
    if(d>640)continue;var td=fbm(tx*.012+3,tz*.012+9,3);if(td<.44||rnd()>.5+(td-.44)*2)continue;
    if(Math.hypot(tx-VIL.x,tz-VIL.z)<VIL.r+8)continue;if(Math.hypot(tx-LAKE.x,tz-LAKE.z)<LAKE.r*.95)continue;

  if(sceneName==='world'){c.clearRect(0,0,150,150);c.fillStyle='#22332a';c.beginPath();c.arc(75,75,PLAY*S+3,0,6.3);c.fill();
    c.fillStyle='#23404a';c.beginPath();c.arc(75+LAKE.x*S,75+LAKE.z*S,50*S,0,6.3);c.fill();
    c.strokeStyle='#7a6a4c';c.lineWidth=1.5;PATHS.forEach(function(p){c.beginPath();c.moveTo(75+p[0][0]*S,75+p[0][1]*S);for(var i=1;i<p.length;i++)c.lineTo(75+p[i][0]*S,75+p[i][1]*S);c.stroke();});
    c.fillStyle='#b9a06a';houseRects.forEach(function(h){c.fillRect(75+h.x0*S,75+h.z0*S,2.5,2.5);});
    mons.forEach(function(m){if(m.dead>0)return;c.fillStyle=m.type==='wraith'?'#7de0c8':'#d8483c';var s=m.type==='wraith'?5:2.6;c.fillRect(75+m.x*S-s/2,75+m.z*S-s/2,s,s);});
    if(!P.mounted){c.fillStyle='#e6e2da';c.fillRect(75+horse.x*S-2,75+horse.z*S-2,4,4);}
    c.save();c.translate(75+P.x*S,75+P.z*S);c.rotate(-cam.yaw);c.fillStyle='#ffe9a0';c.beginPath();c.moveTo(0,-6);c.lineTo(4,4);c.lineTo(-4,4);c.closePath();c.fill();c.restore();}
}
/* ================= game logic ================= */
function xpNeed(){return 60+P.lvl*60;}
function gainXP(n){P.xp+=n;while(P.xp>=xpNeed()){P.xp-=xpNeed();P.lvl++;P.maxhp+=20;P.hp=P.maxhp;say('等级提升！现在是 '+P.lvl+' 级',3.5);sfx('level');ftext(P.x,yAt(P.x,P.z)+2.4,P.z,'升级！','#ffe9a0');}}
function hurtPlayer(d,from){if(P.hurt>0||P.dead>0)return;P.hp-=d;P.hurt=.6;P.combat=5;sfx('hurt');ftext(P.x,groundY(P.x,P.z)+2.2,P.z,'-'+d,'#ff7b6b');
  var a=Math.atan2(P.x-from.x,P.z-from.z);move(P,Math.sin(a)*.6,Math.cos(a)*.6,.4);
  if(P.hp<=0){P.hp=0;P.dead=3.2;if(P.mounted)dismount();var lost=Math.floor(P.gold*.2);P.gold-=lost;say('你倒下了……村民把你拖回了灰木村'+(lost?'（丢失 '+lost+' 金币）':''),5);}}
function angDiff(a,b){return Math.abs(((a-b+9.4248)%6.2832)-3.1416);}
function attack(){if(P.atk>0||P.mounted)return;P.atk=.4;sfx('swing');var dmg=20+P.lvl*6,hit=false;
  if(sceneName!=='world')return;
  mons.forEach(function(m){if(m.dead>0)return;var d=Math.hypot(m.x-P.x,m.z-P.z);if(d>3.1+m.t.r)return;
    var a=Math.atan2(m.x-P.x,m.z-P.z);if(angDiff(a,P.rot)>1.3&&d>1.2)return;
    var dd=Math.round(dmg*R(.85,1.2));m.hp-=dd;m.hurt=.25;hit=true;P.combat=5;ftext(m.x,groundY(m.x,m.z)+(m.type==='wraith'?4.2:1.7),m.z,''+dd,'#fff3c4');
    if(m.type!=='wraith')move(m,Math.sin(a)*.7,Math.cos(a)*.7,.3);
    if(m.hp<=0){m.dead=m.type==='wraith'?120:35;var gd=Math.round(R(m.t.g[0],m.t.g[1]));P.gold+=gd;P.kills++;var gy=groundY(m.x,m.z);
      ftext(m.x,gy+2.3,m.z,'+'+m.t.xp+' 经验','#9fd4ff');ftext(m.x,gy+2.9,m.z,'+'+gd+' 金币','#ffd866');sfx('coin');gainXP(m.t.xp);
      if(m.type==='wraith')say('林魇消散了。石环重归寂静——暂时。',5);}});
  if(hit)sfx('hit');}
function mount(){P.mounted=true;P.x=horse.x;P.z=horse.z;P.rot=horse.rot;horse.come=false;P.atk=0;horse.q.body.add(hero.root);hero.root.position.set(0,horse.q.seatY+.05-hero.hipY,-.06);hero.root.rotation.set(0,0,0);sfx('neigh');}
function dismount(){P.mounted=false;world.add(hero.root);var sx=Math.cos(P.rot)*1.3,sz=-Math.sin(P.rot)*1.3,ox=P.x,oz=P.z;move(P,sx,sz,.4);if(Math.hypot(P.x-ox,P.z-oz)<.5)move(P,-sx,-sz,.4);horse.come=false;}
function update(dt){
  var k=keys,mx=0,mz=0;
  if(P.drunk>0)P.drunk-=dt;if(P.hurt>0)P.hurt-=dt;if(P.atk>0)P.atk-=dt;if(P.combat>0)P.combat-=dt;
  if(k.ArrowLeft)cam.yaw+=dt*1.8;if(k.ArrowRight)cam.yaw-=dt*1.8;if(k.ArrowUp)cam.pitch=clamp(cam.pitch+dt,.04,1.25);if(k.ArrowDown)cam.pitch=clamp(cam.pitch-dt,.04,1.25);
  prompt='';
  if(P.dead>0){P.dead-=dt;if(P.dead<=0){P.hp=Math.round(P.maxhp*.6);if(sceneName!=='world')leaveTavern();P.x=-150;P.z=50;dialog=null;}}
  else{
    var f=0,s=0;if(k.w)f++;if(k.s)f--;if(k.d)s++;if(k.a)s--;
    P.moving=!!(f||s);P.run=!!k.Shift;if(dialog&&P.moving)dialog=null;
    if(P.moving){var l=Math.hypot(f,s);f/=l;s/=l;mx=-Math.sin(cam.yaw)*f+Math.cos(cam.yaw)*s;mz=-Math.cos(cam.yaw)*f-Math.sin(cam.yaw)*s;
      var tr=Math.atan2(mx,mz),df=((tr-P.rot+9.4248)%6.2832)-3.1416;P.rot+=df*Math.min(1,dt*(P.mounted?5:12));
      var sp=P.mounted?(P.run?14:7.5):(P.run?7.2:4.3);
      if(sceneName==='world'&&groundY(P.x,P.z)<waterY-.15)sp*=.55;if(P.atk>0)sp*=.35;
      if(P.mounted){mx=Math.sin(P.rot);mz=Math.cos(P.rot);}
      move(P,mx*sp*dt,mz*sp*dt,P.mounted?.8:.4);
      if(P.mounted){horse.x=P.x;horse.z=P.z;horse.rot=P.rot;}}
    if(P.combat<=0&&P.hp<P.maxhp)P.hp=Math.min(P.maxhp,P.hp+dt*2);
    if(pressed[' ']||pressed.j){if(P.mounted)say('先下马（F）才能挥刃',2);else attack();}
    if(pressed.m){musicOn=!musicOn;if(musicBus)musicBus.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.3);say(musicOn?'音乐：开':'音乐：关',1.5);}
    if(sceneName==='world')updWorld(dt);else updTavern(dt);
  }
  if(sceneName==='world'){mons.forEach(function(m){updMon(m,dt);});
    villagers.forEach(function(v){v.wait-=dt;if(dialog&&dialog.who===v){v.moving=false;return;}
      if(v.wait<=0){v.wait=R(3,9);v.tx=v.hx+R(-7,7);v.tz=v.hz+R(-6,6);}
      var d=Math.hypot(v.tx-v.x,v.tz-v.z);v.moving=d>.4;
      if(v.moving){var a=Math.atan2(v.tx-v.x,v.tz-v.z),ox=v.x,oz=v.z;move(v,Math.sin(a)*1.2*dt,Math.cos(a)*1.2*dt,.4);v.rot=a;if(Math.abs(v.x-ox)+Math.abs(v.z-oz)<.002){v.tx=v.x;v.tz=v.z;}}});}
  pressed={};
}
function updMon(m,dt){
  if(m.dead>0){m.dead-=dt;m.sink=Math.min(1,m.sink+dt*.8);if(m.dead<=0){m.hp=m.t.hp;m.x=m.hx;m.z=m.hz;m.sink=0;}return;}
  if(m.hurt>0)m.hurt-=dt;if(m.cd>0)m.cd-=dt;
  var d=Math.hypot(m.x-P.x,m.z-P.z),home=Math.hypot(m.x-m.hx,m.z-m.hz),tx,tz,sp=m.t.spd;
  var safe=Math.hypot(P.x-VIL.x,P.z-VIL.z)<VIL.r-8;
  if(P.dead<=0&&d<m.t.aggro&&home<62&&!safe){tx=P.x;tz=P.z;if(d<m.t.r+1.3&&m.cd<=0){m.cd=1.3;m.lunge=.3;hurtPlayer(m.t.dmg,m);}}
  else{m.wt-=dt;if(m.wt<=0){m.wt=R(2,6);m.wx=m.hx+R(-9,9);m.wz=m.hz+R(-9,9);}tx=m.wx;tz=m.wz;sp*=.3;}
  var dd=Math.hypot(tx-m.x,tz-m.z);m.moving=dd>m.t.r+.8;m.spd=sp;
  if(m.moving){var a=Math.atan2(tx-m.x,tz-m.z);if(m.hurt>0)sp*=.3;move(m,Math.sin(a)*sp*dt,Math.cos(a)*sp*dt,m.type==='wraith'?.2:.35);var df=((a-m.rot+9.4248)%6.2832)-3.1416;m.rot+=df*Math.min(1,dt*8);}
}
function updWorld(dt){
  if(!P.mounted){
    if(horse.come){var d=Math.hypot(horse.x-P.x,horse.z-P.z);if(d<3){horse.come=false;horse.moving=false;}
      else{var a=Math.atan2(P.x-horse.x,P.z-horse.z);horse.x+=Math.sin(a)*13*dt;horse.z+=Math.cos(a)*13*dt;horse.rot=a;horse.moving=true;}}
    else horse.moving=false;}
  if(pressed.h){sfx('whistle');if(P.mounted)say('雪雀打了个响鼻——你就在它背上',2);else{
      if(Math.hypot(horse.x-P.x,horse.z-P.z)>45){var a2=cam.yaw+R(-.9,.9);horse.x=P.x+Math.sin(a2)*38;horse.z=P.z+Math.cos(a2)*38;}
      horse.come=true;say('你吹了声口哨，雪雀正在赶来',2.2);setTimeout(function(){sfx('neigh');},500);}}
  var nearH=!P.mounted&&Math.hypot(horse.x-P.x,horse.z-P.z)<3.6;
  if(pressed.f){if(P.mounted)dismount();else if(nearH)mount();else say('雪雀不在身边——按 H 吹口哨',2);}
  if(P.mounted){prompt='F 下马';return;}
  var nv=null,nd=3;villagers.forEach(function(v){var d=Math.hypot(v.x-P.x,v.z-P.z);if(d<nd){nd=d;nv=v;}});
  if(Math.hypot(P.x-tavernDoor.x,P.z-tavernDoor.z)<2.2){prompt='E 进入「醉鸦」酒馆';if(pressed.e)enterTavern();}
  else if(nv){prompt='E 与'+nv.name.split(' ')[1]+'交谈';if(pressed.e){dialog={who:nv,text:nv.lines[nv.li%nv.lines.length]};nv.li++;nv.rot=Math.atan2(P.x-nv.x,P.z-nv.z);}}
  else if(nearH)prompt='F 骑上雪雀';
  if(dialog&&Math.hypot(dialog.who.x-P.x,dialog.who.z-P.z)>5)dialog=null;
}
function enterTavern(){saved={x:tavernDoor.x,z:tavernDoor.z+.6,yaw:cam.yaw,dist:cam.dist};sceneName='tavern';scene=inside;inside.add(hero.root);P.x=0;P.z=3.4;P.rot=Math.PI;cam.yaw=0;cam.pitch=.55;cam.dist=8.5;dialog=null;say('「醉鸦」酒馆 —— 炉火正旺',2.5);}
function leaveTavern(){sceneName='world';scene=world;world.add(hero.root);P.x=saved.x;P.z=saved.z;P.rot=0;cam.yaw=saved.yaw;cam.dist=saved.dist;cam.pitch=.3;}
function updTavern(dt){
  if(P.z<-.9&&Math.abs(P.x+.4)<3.8){prompt='E 买一杯蜜酒（5 金币）';
    if(pressed.e){if(P.gold>=5){P.gold-=5;P.hp=Math.min(P.maxhp,P.hp+45);P.drunk=Math.min(40,P.drunk+14);sfx('drink');ftext(P.x,2.2,P.z,'+45 生命','#9fe6a0');
        say(['酒保：「敬还活着的人。」','蜜酒下肚，一股暖意。','酒保：「再来一杯？林子里可没这个。」'][Math.floor(Math.random()*3)],3);}
      else say('酒保：「没钱？去林子里宰几头狼再来。」',3);}}
  else if(P.z>2.9&&Math.abs(P.x)<1.6){prompt='E 离开酒馆';if(pressed.e)leaveTavern();}
}
/* ================= frame ================= */
var camPos=new T.Vector3(),tgt=new T.Vector3(),clock=new T.Clock(),running=false,ready=false;
function place(){
  var py=yAt(P.x,P.z);
  if(!P.mounted){hero.root.position.set(P.x,py,P.z);hero.root.rotation.set(0,P.rot,0);
    if(P.dead>0){hero.root.rotation.x=-Math.min(1.5,(3.2-P.dead)*3);hero.root.position.y+=.15;}
    animHuman(hero,P.moving&&P.dead<=0,clockDt,P.run?12.5:8.6,P.atk,P.run?'run':'');
    if(P.moving&&P.dead<=0&&running){var sp_=Math.sin(hero.phase);if((sp_>0)!==(hero.lastS>0))sfx('step');hero.lastS=sp_;}
    hero.root.visible=!(P.hurt>0&&Math.floor(P.hurt*18)%2);}
  else{hero.root.visible=true;animHuman(hero,P.moving,clockDt,0,0,'mounted');}
  hero.back.visible=!(P.atk>0)||P.mounted;hero.hand.visible=P.atk>0&&!P.mounted;hero.arc.material.opacity=(P.atk>0&&!P.mounted)?(P.atk/.4)*.55:0;
  animCloak(hero,P.mounted?(P.moving?(P.run?1:.6):.3):(P.moving&&P.dead<=0?(P.run?.75:.3):0),clockDt);
  var hq=horse.q,hm=P.mounted?P.moving:horse.moving;hq.root.position.set(horse.x,groundY(horse.x,horse.z),horse.z);hq.root.rotation.y=horse.rot;
  animHorse(hq,hm,P.mounted?P.run:true,clockDt,(running&&sceneName==='world')?function(){sfx('hoof');}:null);
  if(sceneName==='world'){
    mons.forEach(function(m){var gy=groundY(m.x,m.z);m.root.position.set(m.x,gy-m.sink*(m.type==='wraith'?5:1.6),m.z);m.root.rotation.y=m.rot;m.root.visible=m.sink<1;
      if(m.lunge>0)m.lunge-=clockDt;
      if(m.q){animQuad(m.q,m.moving&&m.dead<=0,clockDt,m.spd>3?16:7,m.spd>3?.9:.4);m.root.rotation.z=m.dead>0?Math.min(1.5,m.sink*4):0;m.q.neck.rotation.x+=m.lunge>0?.5:0;}
      else if(m.h){animHuman(m.h,m.moving&&m.dead<=0,clockDt,6,0);if(m.lunge>0){m.h.armL.rotation.x-=.6;m.h.armR.rotation.x-=.6;}m.root.rotation.x=m.dead>0?-Math.min(1.5,m.sink*4):0;}
      else{m.w.fl.position.y=.35+Math.sin(time*1.6)*.25;m.w.fl.rotation.z=Math.sin(time*1.1)*.05;m.w.shards.forEach(function(s,i){var a=time*(1+i*.13)+i*.8;s.position.set(Math.cos(a)*(1.5+i*.08),1.2+i*.32+Math.sin(a*2)*.2,Math.sin(a)*(1.5+i*.08));s.rotation.set(a,a*1.3,0);});}
      var b=m.bar;b.g.visible=m.dead<=0&&m.hp<m.t.hp;if(b.g.visible){b.g.position.set(m.x,gy+(m.type==='wraith'?4.6:m.type==='wolf'?1.5:2.2),m.z);b.g.quaternion.copy(camera.quaternion);var f=Math.max(0,m.hp/m.t.hp);b.fg.scale.x=f;b.fg.position.x=-b.w*(1-f)/2;}});
    villagers.forEach(function(v){v.h.root.position.set(v.x,groundY(v.x,v.z),v.z);var df=((v.rot-v.h.root.rotation.y+9.4248)%6.2832)-3.1416;v.h.root.rotation.y+=df*.15;animHuman(v.h,v.moving,clockDt,5.2,0);});
    smokeSprites.forEach(function(sp){var u=sp.userData,q=(time*.11+u.t)%1;sp.position.set(u.s.x+q*q*7+Math.sin(q*9+u.t*20)*.4,u.s.y+q*8,u.s.z+q*2);var sc=.8+q*4.5;sp.scale.set(sc,sc,1);sp.material.opacity=(1-q)*.75*Math.min(1,q*8);});
    windowMats.forEach(function(w,i){w.emissiveIntensity=1.4+Math.sin(time*6+i*2)*.15+Math.sin(time*13.7+i)*.1;});
  }else{var fl=Math.sin(time*11)*.3+Math.sin(time*23)*.2;fireL.intensity=2.6+fl;fireM.color.setHSL(.07+fl*.01,1,.55+fl*.05);inLights.forEach(function(l,i){l.intensity=.7+Math.sin(time*9+i*2)*.08;});}
  // camera
  var mdist=cam.dist+(P.mounted?2.5:0),ty=py+(P.mounted?2.4:1.55);tgt.set(P.x,ty,P.z);
  camPos.set(P.x+Math.sin(cam.yaw)*Math.cos(cam.pitch)*mdist,ty+Math.sin(cam.pitch)*mdist,P.z+Math.cos(cam.yaw)*Math.cos(cam.pitch)*mdist);
  if(sceneName==='world'){var cg=groundY(camPos.x,camPos.z)+.6;if(camPos.y<cg)camPos.y=cg;if(camPos.y<waterY+.5)camPos.y=waterY+.5;}
  camera.position.lerp(camPos,(running&&camera.position.distanceTo(camPos)<25)?.25:1);camera.lookAt(tgt);
  if(P.drunk>0){var dk=Math.min(1,P.drunk/10);camera.rotation.z+=Math.sin(time*1.3)*.04*dk;camera.rotation.x+=Math.sin(time*.9)*.012*dk;}
  if(sceneName==='world'){updGrass();skyDome.position.copy(camera.position);sunDisk.position.copy(camera.position).addScaledVector(sunDir,3300);sun.position.set(P.x+sunDir.x*200,py+sunDir.y*200,P.z+sunDir.z*200);sun.target.position.set(P.x,py,P.z);
    var sp=snow.geometry.attributes.position,a=sp.array,cx=camera.position.x,cy=camera.position.y,cz=camera.position.z;
    for(var i=0;i<a.length;i+=3){a[i]+=clockDt*(1.6+Math.sin(time+i)*.6);a[i+1]-=clockDt*(1.3+(i%7)*.12);a[i+2]+=clockDt*.5;
      if(a[i]-cx>30)a[i]-=60;else if(a[i]-cx<-30)a[i]+=60;if(a[i+1]-cy>20)a[i+1]-=40;else if(a[i+1]-cy<-20)a[i+1]+=40;if(a[i+2]-cz>30)a[i+2]-=60;else if(a[i+2]-cz<-30)a[i+2]+=60;}
    sp.needsUpdate=true;}
}
var clockDt=0;
function frame(){requestAnimationFrame(frame);if(!ready)return;clockDt=Math.min(.05,clock.getDelta());time+=clockDt;
  if(running)update(clockDt);else cam.yaw+=clockDt*.05;
  uTime.value=time;place();if(post)post.render(scene,camera);else renderer.render(scene,camera);if(running)updHUD(clockDt);}
function build(){
  buildTerrain();buildSky();buildVillage();buildForest();buildGrass();buildSmoke();buildEntities();buildInterior();try{initPost();}catch(e){console.error(e);post=null;renderer.toneMapping=T.ACESFilmicToneMapping;}
  var a=0;while(solid(P.x,P.z,.5)&&a<20){P.z+=1;a++;}
  camera.position.set(P.x+4,groundY(P.x,P.z)+4,P.z+8);
  ready=true;$('go').disabled=false;$('go').textContent='启程';window.__game={P:P,cam:cam,horse:horse,mons:mons,enterTavern:enterTavern,ready:true};
}
requestAnimationFrame(frame);
setTimeout(function(){try{build();}catch(e){$('go').textContent='生成失败：'+e.message;console.error(e);}},60);
$('go').addEventListener('click',function(){if(!ready)return;$('start').style.display='none';$('hud').style.display='block';
  try{initAudio();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}
  running=true;window.focus();say('灰木村 —— 村民说，林子里不太平',4);});
})();
</script>
